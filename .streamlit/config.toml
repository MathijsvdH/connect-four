# Minimal light theme shared by the Streamlit widgets and the board component (ui/board.css uses the same colours)
[theme]
base = "light"
primaryColor = "#1f2a44"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#ecebe6"
textColor = "#1d1d1f"
borderColor = "#e2e0d9"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
baseRadius = "10px"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
