# Light and dark themes shared by the Streamlit widgets and the board component (ui/board.css uses the same colours).
# With both [theme.light] and [theme.dark] defined, the app starts in the visitor's system setting; the sun/moon
# button on the board switches between them (Streamlit remembers the choice per browser).
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
baseRadius = "10px"
showWidgetBorder = true

[theme.light]
primaryColor = "#1f2a44"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#ecebe6"
textColor = "#1d1d1f"
borderColor = "#e2e0d9"

[theme.dark]
primaryColor = "#8fa6d9"
backgroundColor = "#141413"
secondaryBackgroundColor = "#1f1f1d"
textColor = "#ecebe6"
borderColor = "#2e2d2a"

[client]
# "viewer" keeps Streamlit's main menu in the page (hidden by ui/page.css): the board's theme button switches themes through it
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
